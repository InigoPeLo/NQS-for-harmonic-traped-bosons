# Parameters for train.py. Run with: python train.py --config config.toml
#
# The keys of [system], [network], [sampler] and [sr] must match the field names of
# boson_trap, NQS, MetroSampler and SR, because train.py passes each section directly to its class.
# These defaults converge to the exact energy E = N for N = 4.

[system]            # boson_trap
n_particles = 4     # number of bosons N

[network]           # NQS
n_visible = 32      # latent dimension F of the Deep Sets encoder
n_hidden_rbm = 32   # hidden units M of the RBM (amplitude)
n_hidden_ffnn = 32  # hidden units K of the FFNN (phase)
alpha = 0.3         # initial value of the Gaussian envelope parameter (exact: 0.5)
init_scale = 0.01   # scale of the initial RBM weights W

[sampler]           # MetroSampler
n_chains = 256      # Markov chains run in parallel
step_size = 0.4     # Metropolis step size delta (aim for ~50% acceptance)
n_sweep = 10        # Metropolis steps between two recorded samples

[sr]                # SR
learning_rate = 0.05  # eta
varepsilon = 1e-3     # diagonal shift epsilon of S

[training]
n_samples = 8           # recorded samples per chain and iteration (Ns = n_chains * n_samples)
n_thermalization = 100  # sweeps discarded before training
n_iter = 150            # number of SR iterations
seed = 0                # seed of the random number generator
